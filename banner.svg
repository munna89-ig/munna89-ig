<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0d1a2b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.78" cy="0.45" r="0.4">
      <stop offset="0" stop-color="#36bcf7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#36bcf7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.9" r="0.35">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="500" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="500" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="500" rx="18" fill="url(#glow2)"/>

  <!-- floating brackets decoration -->
  <text x="560" y="120" font-family="Consolas, 'Courier New', monospace" font-size="54" fill="#36bcf7" fill-opacity="0.12">{ }</text>
  <text x="560" y="455" font-family="Consolas, 'Courier New', monospace" font-size="40" fill="#8b7bff" fill-opacity="0.14">&lt;/&gt;</text>

  <!-- ============ LEFT: TEXT ============ -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <!-- status pill -->
    <g transform="translate(80,118)">
      <rect width="232" height="34" rx="17" fill="#36bcf7" fill-opacity="0.1" stroke="#36bcf7" stroke-opacity="0.45"/>
      <circle cx="22" cy="17" r="5" fill="#3fdc8a">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="38" y="23" font-size="15" font-weight="600" fill="#9fdcff" letter-spacing="0.5">Open to internships</text>
    </g>

    <text x="78" y="222" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="1">MD. ROFIQULLAH</text>
    <text x="78" y="290" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="1">MUNNA</text>

    <rect x="80" y="314" width="90" height="5" rx="2.5" fill="url(#accent)"/>

    <text x="80" y="360" font-size="23" font-weight="600" fill="url(#accent)" letter-spacing="3.5">FULL-STACK &amp; BACKEND DEVELOPER</text>

    <text x="80" y="402" font-size="18" fill="#b8c4d6">Building secure, reliable web apps with</text>
    <text x="80" y="428" font-size="18" fill="#b8c4d6">ASP.NET Core, EF Core &amp; NestJS  ·  CSE @ AIUB</text>
  </g>

  <!-- ============ RIGHT: CODE WINDOW ============ -->
  <g transform="translate(730,80)" filter="url(#shadow)">
    <rect width="400" height="300" rx="14" fill="#0d1526" stroke="#2a3a55"/>
    <path d="M0 14 a14 14 0 0 1 14 -14 h372 a14 14 0 0 1 14 14 v24 h-400 z" fill="#16223a"/>
    <circle cx="22" cy="19" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="19" r="6" fill="#febc2e"/>
    <circle cx="62" cy="19" r="6" fill="#28c840"/>
    <text x="200" y="24" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7f8ea8">Program.cs</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="15.5" xml:space="preserve">
      <text x="22" y="72"><tspan fill="#c586c0">var</tspan><tspan fill="#d4d4d4"> builder = </tspan><tspan fill="#4ec9b0">WebApplication</tspan></text>
      <text x="22" y="96"><tspan fill="#d4d4d4">    .</tspan><tspan fill="#dcdcaa">CreateBuilder</tspan><tspan fill="#d4d4d4">(args);</tspan></text>
      <text x="22" y="128"><tspan fill="#d4d4d4">builder.Services</tspan></text>
      <text x="22" y="152"><tspan fill="#d4d4d4">    .</tspan><tspan fill="#dcdcaa">AddDbContext</tspan><tspan fill="#d4d4d4">&lt;</tspan><tspan fill="#4ec9b0">ShopDb</tspan><tspan fill="#d4d4d4">&gt;()</tspan></text>
      <text x="22" y="176"><tspan fill="#d4d4d4">    .</tspan><tspan fill="#dcdcaa">AddAuthorization</tspan><tspan fill="#d4d4d4">();</tspan></text>
      <text x="22" y="208"><tspan fill="#c586c0">var</tspan><tspan fill="#d4d4d4"> app = builder.</tspan><tspan fill="#dcdcaa">Build</tspan><tspan fill="#d4d4d4">();</tspan></text>
      <text x="22" y="232"><tspan fill="#d4d4d4">app.</tspan><tspan fill="#dcdcaa">MapControllers</tspan><tspan fill="#d4d4d4">();</tspan></text>
      <text x="22" y="264"><tspan fill="#d4d4d4">app.</tspan><tspan fill="#dcdcaa">Run</tspan><tspan fill="#d4d4d4">(); </tspan><tspan fill="#6a9955">// 🚀 ready</tspan></text>
    </g>
    <!-- blinking cursor -->
    <rect x="230" y="252" width="9" height="18" fill="#36bcf7">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- tech chips under window -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(824,396)">
      <rect width="62" height="30" rx="15" fill="#512bd4" fill-opacity="0.25" stroke="#7c5cff" stroke-opacity="0.6"/>
      <text x="31" y="20" text-anchor="middle" fill="#cfc3ff">.NET</text>
    </g>
    <g transform="translate(896,396)">
      <rect width="50" height="30" rx="15" fill="#239120" fill-opacity="0.22" stroke="#3fb950" stroke-opacity="0.6"/>
      <text x="25" y="20" text-anchor="middle" fill="#a6f0b0">C#</text>
    </g>
    <g transform="translate(956,396)">
      <rect width="80" height="30" rx="15" fill="#e0234e" fill-opacity="0.2" stroke="#ff5c7c" stroke-opacity="0.6"/>
      <text x="40" y="20" text-anchor="middle" fill="#ffb3c2">NestJS</text>
    </g>
    <g transform="translate(767,436)">
      <rect width="106" height="30" rx="15" fill="#cc2927" fill-opacity="0.2" stroke="#ff6b66" stroke-opacity="0.6"/>
      <text x="53" y="20" text-anchor="middle" fill="#ffc1bf">SQL Server</text>
    </g>
    <g transform="translate(883,436)">
      <rect width="106" height="30" rx="15" fill="#4169e1" fill-opacity="0.25" stroke="#6f9cff" stroke-opacity="0.6"/>
      <text x="53" y="20" text-anchor="middle" fill="#c4d6ff">PostgreSQL</text>
    </g>
    <g transform="translate(999,436)">
      <rect width="94" height="30" rx="15" fill="#3ecf8e" fill-opacity="0.18" stroke="#3ecf8e" stroke-opacity="0.6"/>
      <text x="47" y="20" text-anchor="middle" fill="#b4f5d6">Supabase</text>
    </g>
  </g>
</svg>
